<!doctype html><meta charset="utf-8"><title>BANKER görsel</title>
<script>
const q=new URLSearchParams(location.search);
const files=(q.get('f')||'gorseller/iap-inceleme.png').split(',');
Promise.all(files.map(f=>fetch(f).then(r=>r.blob()))).then(bs=>{
  try{ if(files.length===1 && !q.get('f')) parent.postMessage({iap:bs[0]},'*'); else parent.postMessage({files:files, blobs:bs},'*'); }catch(e){}
});
</script>
